<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1789: Diario de la Revolución</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap');

:root{
  --bg:#12141c;
  --bg-vignette:#0a0b10;
  --paper:#f3e9d3;
  --paper-edge:#e4d7b8;
  --ink:#2b2419;
  --ink-soft:#5a4f3c;
  --blue:#35507e;
  --blue-deep:#243a5e;
  --red:#9a3330;
  --red-deep:#732423;
  --gold:#c69a4b;
  --gold-soft:#e3c481;
}

*{box-sizing:border-box;}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(ellipse at 50% -10%, #1c2130 0%, var(--bg) 55%, var(--bg-vignette) 100%);
  font-family:'Lora', serif;
  color:var(--paper);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:32px 16px 64px;
}

.app{ width:100%; max-width:680px; }

/* ---------- Masthead ---------- */
.masthead{
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:22px;
}
.rosette{ flex:none; }
.masthead-text h1{
  font-family:'Playfair Display', serif;
  font-weight:700;
  font-size:1.5rem;
  margin:0 0 2px;
  letter-spacing:0.3px;
  color:var(--paper);
}
.masthead-text p{
  margin:0;
  font-size:0.82rem;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--gold-soft);
}

/* ---------- Timeline ---------- */
.timeline{
  display:flex;
  align-items:center;
  margin:0 0 28px;
  padding:0 4px;
}
.timeline .seg{
  flex:1;
  height:3px;
  background:rgba(243,233,211,0.15);
  position:relative;
}
.timeline .seg.filled{ background:var(--gold); }
.timeline .dot{
  flex:none;
  width:11px;height:11px;border-radius:50%;
  background:rgba(243,233,211,0.2);
  border:2px solid rgba(243,233,211,0.3);
  transition:all .35s ease;
}
.timeline .dot.done{
  background:var(--gold);
  border-color:var(--gold-soft);
  box-shadow:0 0 8px rgba(198,154,75,0.7);
}
.timeline .dot.current{
  background:var(--red);
  border-color:#e07f7c;
  box-shadow:0 0 10px rgba(154,51,48,0.8);
  transform:scale(1.25);
}

/* ---------- Scene card ---------- */
.card{
  background:var(--paper);
  color:var(--ink);
  border-radius:3px;
  padding:34px 34px 30px;
  box-shadow:
    0 1px 0 var(--paper-edge) inset,
    0 18px 40px rgba(0,0,0,0.45);
  position:relative;
  overflow:hidden;
  animation:pageIn .5s ease;
}
.card::before{
  content:"";
  position:absolute; inset:0;
  background:
    linear-gradient(90deg,var(--blue) 0 5px, var(--paper) 5px 8px, var(--paper) calc(100% - 8px), var(--red) calc(100% - 8px) calc(100% - 5px), var(--paper) calc(100% - 5px));
  opacity:0.9;
  pointer-events:none;
}
@keyframes pageIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

.scene-meta{
  font-family:'Lora',serif;
  font-style:italic;
  font-size:0.85rem;
  color:var(--ink-soft);
  margin-bottom:6px;
  letter-spacing:0.3px;
}
.scene-title{
  font-family:'Playfair Display', serif;
  font-weight:700;
  font-size:1.55rem;
  line-height:1.25;
  margin:0 0 16px;
  color:var(--red-deep);
}
.scene-text{
  font-size:1.03rem;
  line-height:1.7;
  margin:0 0 20px;
}
.scene-text strong{ color:var(--blue-deep); }

.fact-box{
  background:rgba(53,80,126,0.08);
  border-left:3px solid var(--blue);
  padding:11px 14px;
  font-size:0.88rem;
  line-height:1.55;
  color:var(--ink-soft);
  margin-bottom:24px;
  border-radius:0 4px 4px 0;
}
.fact-box b{ color:var(--blue-deep); }

.choices{ display:flex; flex-direction:column; gap:12px; }
.choice-btn{
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  width:100%;
  background:#fffaf0;
  border:1px solid var(--paper-edge);
  border-left:4px solid var(--gold);
  border-radius:4px;
  padding:14px 16px;
  font-family:'Lora',serif;
  font-size:0.98rem;
  color:var(--ink);
  cursor:pointer;
  transition:all .18s ease;
}
.choice-btn:hover{
  background:#fff;
  border-left-color:var(--red);
  transform:translateX(3px);
  box-shadow:0 4px 14px rgba(0,0,0,0.12);
}
.seal{
  flex:none;
  width:26px;height:26px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 60%, #a87e33 100%);
  box-shadow:inset 0 0 3px rgba(0,0,0,0.4);
}

/* ---------- Start screen ---------- */
.start-field{
  width:100%;
  font-family:'Lora',serif;
  font-size:1rem;
  padding:11px 14px;
  border:1px solid var(--paper-edge);
  border-radius:4px;
  background:#fffaf0;
  color:var(--ink);
  margin-bottom:18px;
}
.start-field:focus{ outline:2px solid var(--blue); outline-offset:1px; }

.primary-btn{
  background:var(--red-deep);
  color:#fbeee0;
  border:none;
  border-radius:4px;
  padding:13px 20px;
  font-family:'Playfair Display',serif;
  font-weight:700;
  font-size:1rem;
  letter-spacing:0.4px;
  cursor:pointer;
  width:100%;
  transition:background .18s ease;
}
.primary-btn:hover{ background:#8a2b28; }
.primary-btn:focus-visible, .choice-btn:focus-visible{ outline:3px solid var(--gold-soft); outline-offset:2px; }

/* ---------- Ending ---------- */
.ending-badge{
  display:inline-block;
  font-family:'Lora',serif;
  font-style:italic;
  font-size:0.8rem;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--gold);
  border:1px solid var(--gold);
  padding:3px 10px;
  border-radius:20px;
  margin-bottom:12px;
}

footer{
  margin-top:22px;
  text-align:center;
  font-size:0.78rem;
  color:rgba(243,233,211,0.35);
}

@media (max-width:480px){
  .card{ padding:24px 20px 24px; }
  .masthead-text h1{ font-size:1.25rem; }
}

@media (prefers-reduced-motion: reduce){
  .card{ animation:none; }
  .choice-btn:hover{ transform:none; }
}
</style>
</head>
<body>

<div class="app">
  <div class="masthead">
    <svg class="rosette" width="46" height="46" viewBox="0 0 46 46">
      <circle cx="23" cy="23" r="21" fill="#35507e"/>
      <circle cx="23" cy="23" r="14" fill="#f3e9d3"/>
      <circle cx="23" cy="23" r="7" fill="#9a3330"/>
    </svg>
    <div class="masthead-text">
      <h1>1789: Diario de la Revolución</h1>
      <p>Una historia interactiva · París, 1789–1794</p>
    </div>
  </div>

  <div class="timeline" id="timeline"></div>

  <div class="card" id="card"></div>

  <footer>Cada decisión está inspirada en hechos reales de la Revolución Francesa.</footer>
</div>

<script>
const STAGES = ["n1","n2","n3","n4","n5","n6","n7","end"];

const state = { name:"", radical:0, moderate:0, riesgo:0, stage:0 };

const STORY = {
  n1:{
    date:"Mayo de 1789 · Versalles",
    title:"La convocatoria de los Estados Generales",
    fact:"Los Estados Generales no se reunían desde 1614: casi 175 años antes de esta convocatoria.",
    text:(n)=>`Querido diario: el rey Luis XVI ha convocado a los Estados Generales para resolver la crisis financiera del reino. Nobleza, clero y el Tercer Estado —el pueblo llano, al que perteneces, ${n}— se reúnen en Versalles. Se respira una mezcla de esperanza y desconfianza.`,
    choices:[
      {label:"Viajar a Versalles para presenciar la apertura con tus propios ojos", effect:{radical:1}, next:"n2"},
      {label:"Quedarte en París, siguiendo la noticia a través de panfletos y cafés", effect:{moderate:1}, next:"n2"}
    ]
  },
  n2:{
    date:"20 de junio de 1789 · Versalles",
    title:"El Juramento del Juego de Pelota",
    fact:"El Tercer Estado representaba a más del 95% de la población francesa, pero su voto pesaba igual que el del clero o la nobleza por separado.",
    text:(n)=>`Los diputados del Tercer Estado, excluidos de la sala de sesiones, se reúnen en una cancha de juego de pelota y juran no separarse hasta dar a Francia una constitución. Se autoproclaman Asamblea Nacional. La noticia llega a ti, ${n}, como una chispa.`,
    choices:[
      {label:"Unirte a los grupos que debaten en los cafés, defendiendo abiertamente a la Asamblea", effect:{radical:1}, next:"n3"},
      {label:"Observar con cautela, sin saber todavía si esto traerá orden o caos", effect:{moderate:1}, next:"n3"}
    ]
  },
  n3:{
    date:"14 de julio de 1789 · París",
    title:"La toma de la Bastilla",
    fact:"Aquel día la Bastilla solo custodiaba a siete prisioneros, pero como símbolo del poder absoluto del rey, su caída fue una sacudida para toda Europa.",
    text:(n)=>`Rumores de tropas reales acercándose a París corren como pólvora. Una multitud armada marcha hacia la fortaleza-prisión de la Bastilla en busca de pólvora y armas. Al caer la tarde, la fortaleza se rinde.`,
    choices:[
      {label:"Unirte a la multitud que marcha hacia la Bastilla", effect:{radical:1, riesgo:1}, next:"n4"},
      {label:"Quedarte resguardado en casa, siguiendo los gritos desde tu ventana", effect:{moderate:1}, next:"n4"}
    ]
  },
  n4:{
    date:"5 de octubre de 1789 · París → Versalles",
    title:"La marcha de las mujeres a Versalles",
    fact:"Fueron sobre todo las mujeres del mercado de París —hartas del precio del pan— quienes iniciaron esta marcha que terminó trayendo a la familia real a vivir a París.",
    text:(n)=>`El hambre y el precio del pan desatan la furia popular. Miles de mujeres parten desde los mercados de París hacia Versalles para exigir pan y traer al rey a la capital, donde el pueblo pueda vigilarlo.`,
    choices:[
      {label:"Sumarte a la marcha, exigiendo pan junto a las mujeres de París", effect:{radical:1, riesgo:1}, next:"n5"},
      {label:"No participar: te parece un paso demasiado peligroso", effect:{moderate:1}, next:"n5"}
    ]
  },
  n5:{
    date:"Junio de 1791 · Varennes",
    title:"La huida frustrada del rey",
    fact:"El rey fue reconocido durante su huida porque un empleado de posta comparó su rostro con el retrato impreso en un billete (assignat).",
    text:(n)=>`Luis XVI intenta huir de Francia disfrazado, buscando ayuda extranjera contra la Revolución. Es reconocido y detenido en Varennes, y devuelto a París bajo escolta. La confianza en la monarquía se quiebra para muchos, ${n}.`,
    choices:[
      {label:"Concluir que la monarquía ya no tiene remedio y unirte a un club jacobino que pide una república", effect:{radical:1}, next:"n6"},
      {label:"Sentir lástima por el rey y guardar tus dudas sobre el rumbo que toma la Revolución", effect:{moderate:1}, next:"n6"}
    ]
  },
  n6:{
    date:"21 de enero de 1793 · Plaza de la Revolución, París",
    title:"La ejecución de Luis XVI",
    fact:"Luis XVI fue ejecutado en la actual Plaza de la Concordia, entonces llamada Plaza de la Revolución.",
    text:(n)=>`La Convención Nacional ha declarado a Francia una república y condenado al rey por traición. Ante una multitud silenciosa, la guillotina cae. Francia ya no tiene rey, y las potencias europeas se preparan para la guerra contra ella.`,
    choices:[
      {label:"Celebrar la ejecución en público como el fin de la tiranía", effect:{radical:1}, next:"n7"},
      {label:"Guardar silencio, inquieto por lo que este acto pueda desatar", effect:{moderate:1}, next:"n7"}
    ]
  },
  n7:{
    date:"Verano de 1794 · París",
    title:"El Terror",
    fact:"Durante el llamado Gran Terror, en pocas semanas de 1794, miles de personas fueron ejecutadas tras juicios sumarios por sospecha de deslealtad a la Revolución.",
    text:(n)=>`El Comité de Salvación Pública, liderado por Robespierre, persigue a todo aquel que pueda ser un «enemigo de la Revolución». Tu propio vecino, un antiguo comerciante, es acusado de simpatizar con los emigrados. Te preguntan qué sabes de él.`,
    choices:[
      {label:"Denunciarlo ante el comité de tu sección, para probar tu lealtad", effect:{radical:2, riesgo:-1}, next:"end"},
      {label:"Negarte a denunciarlo, aunque eso levante sospechas sobre ti", effect:{moderate:1, riesgo:2}, next:"end"}
    ]
  }
};

const ENDINGS = {
  victima:{
    badge:"Final trágico",
    title:"Víctima del Terror",
    text:(n)=>`Tus dudas no pasaron desapercibidas. Días después, alguien te denuncia ante el Comité de Vigilancia. El juicio es breve —bajo la Ley de Prairial casi no hacía falta prueba alguna— y la condena, inapelable. Subes al cadalso poco antes de que, el 9 de Termidor (27 de julio de 1794), el propio Robespierre sea depuesto y guillotinado al día siguiente. La Revolución que ayudó a nacer terminó devorando a muchos de los suyos, ${n} entre ellos.`
  },
  revolucionario:{
    badge:"Final agridulce",
    title:"El revolucionario que sobrevivió",
    text:(n)=>`Sobreviviste al Terror, pero no sin costo. El 9 de Termidor, Robespierre cae y es ejecutado; el péndulo político vuelve a moverse. En los años del Directorio te conviertes en un modesto funcionario del nuevo régimen, ${n}, orgulloso de haber visto nacer una nueva Francia, aunque algunas noches el recuerdo de aquella denuncia todavía te quita el sueño.`
  },
  prudente:{
    badge:"Final sereno",
    title:"El superviviente prudente",
    text:(n)=>`Nunca fuiste de los que gritaban más fuerte, ni de los que se escondían del todo. Esa cautela te mantuvo con vida. Cuando Robespierre cae el 9 de Termidor de 1794, sientes un alivio silencioso. Con los años cuentas a tus hijos, ${n}, lo que viviste: no como héroe ni como víctima, sino como testigo de una época que cambió Francia para siempre.`
  },
  testigo:{
    badge:"Final equilibrado",
    title:"El testigo de una época",
    text:(n)=>`Tu camino osciló entre el entusiasmo y la duda, como el de tantos franceses de tu tiempo. Sobrevives a la caída de Robespierre en Termidor y ves nacer el Directorio. Con los años te das cuenta, ${n}, de que la Revolución no fue una sola historia, sino miles como la tuya: contradictorias, valientes y humanas a la vez.`
  }
};

function computeEnding(){
  if(state.riesgo>=3) return "victima";
  if(state.radical>state.moderate) return "revolucionario";
  if(state.moderate>state.radical) return "prudente";
  return "testigo";
}

function renderTimeline(){
  const el = document.getElementById("timeline");
  el.innerHTML = "";
  STAGES.forEach((s,i)=>{
    const dot = document.createElement("div");
    dot.className = "dot" + (i<state.stage?" done":"") + (i===state.stage?" current":"");
    el.appendChild(dot);
    if(i<STAGES.length-1){
      const seg = document.createElement("div");
      seg.className = "seg" + (i<state.stage?" filled":"");
      el.appendChild(seg);
    }
  });
}

function renderStart(){
  state.stage = 0;
  renderTimeline();
  const card = document.getElementById("card");
  card.innerHTML = `
    <div class="scene-meta">Primavera de 1789 · París</div>
    <div class="scene-title">Comienza tu diario</div>
    <p class="scene-text">Eres un joven parisino a punto de vivir, en primera persona, los años que cambiarán Francia para siempre: desde la convocatoria de los Estados Generales hasta la caída de Robespierre. Cada decisión que tomes moldeará tu destino.</p>
    <input class="start-field" id="nameInput" type="text" placeholder="Escribe tu nombre..." maxlength="20">
    <button class="primary-btn" id="startBtn">Comenzar tu diario</button>
  `;
  document.getElementById("startBtn").addEventListener("click", ()=>{
    const v = document.getElementById("nameInput").value.trim();
    state.name = v || "ciudadano";
    renderScene("n1");
  });
  document.getElementById("nameInput").addEventListener("keydown", e=>{
    if(e.key==="Enter") document.getElementById("startBtn").click();
  });
}

function renderScene(id){
  state.stage = STAGES.indexOf(id);
  renderTimeline();
  const s = STORY[id];
  const card = document.getElementById("card");
  card.innerHTML = `
    <div class="scene-meta">${s.date}</div>
    <div class="scene-title">${s.title}</div>
    <p class="scene-text">${s.text(state.name)}</p>
    <div class="fact-box"><b>Sabías que…</b> ${s.fact}</div>
    <div class="choices"></div>
  `;
  const choicesEl = card.querySelector(".choices");
  s.choices.forEach(c=>{
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.innerHTML = `<span class="seal"></span><span>${c.label}</span>`;
    btn.addEventListener("click", ()=>{
      if(c.effect.radical) state.radical += c.effect.radical;
      if(c.effect.moderate) state.moderate += c.effect.moderate;
      if(c.effect.riesgo) state.riesgo += c.effect.riesgo;
      if(c.next==="end"){ renderEnding(); }
      else { renderScene(c.next); }
      card.scrollIntoView({behavior:"smooth", block:"start"});
    });
    choicesEl.appendChild(btn);
  });
}

function renderEnding(){
  state.stage = STAGES.length-1;
  renderTimeline();
  const key = computeEnding();
  const e = ENDINGS[key];
  const card = document.getElementById("card");
  card.innerHTML = `
    <div class="scene-meta">Julio de 1794 · Epílogo</div>
    <div class="ending-badge">${e.badge}</div>
    <div class="scene-title">${e.title}</div>
    <p class="scene-text">${e.text(state.name)}</p>
    <div class="fact-box"><b>Para saber más</b> Robespierre fue depuesto el 9 de Termidor del año II (27 de julio de 1794) y ejecutado al día siguiente, marcando el fin del período conocido como «el Terror».</div>
    <button class="primary-btn" id="restartBtn">Jugar de nuevo</button>
  `;
  document.getElementById("restartBtn").addEventListener("click", ()=>{
    state.name=""; state.radical=0; state.moderate=0; state.riesgo=0;
    renderStart();
  });
}

renderStart();
</script>
</body>
</html>
