const { useState, useRef, useEffect } = React;

/* =========================================================
   TOKENS DE DISEÑO — 8 BIT, azul claro + mármol + tinta negra
   ========================================================= */
const INK = "#1a1a1a";
const WHITE = "#ffffff";
const SKY_BLUE = "#bfe3f5";
const SKY_BLUE_DEEP = "#8fd0ee";
const BLUE = "#0d5eaf";
const BLUE_DARK = "#0a3d73";
const MARBLE = "#f2efe6";
const MARBLE_MID = "#cfc9ba";
const MARBLE_DARK = "#9b9585";
const GOLD = "#c9a227";

const PIXEL_FONT = "'Press Start 2P', monospace";
const RETRO_FONT = "'VT323', monospace";

function pixelPanel(extra) {
  return {
    background: WHITE,
    border: `4px solid ${INK}`,
    borderRadius: 0,
    boxShadow: `6px 6px 0 rgba(0,0,0,.35)`,
    imageRendering: "pixelated",
    ...extra,
  };
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* =========================================================
   AUDIO — blip 8-bit al deslizar + música ambiental griega.
   Reescrito con la Web Audio API nativa del navegador (sin
   librerías externas, para máxima compatibilidad). Intenta
   primero una grabación real y libre de derechos (Internet
   Archive / Free Music Archive, licencia CC BY-NC-SA: "Seikilos
   Epitaph with the Lyre of Apollo" por Lina Palera — una
   reconstrucción de la melodía griega más antigua conservada,
   tocada en lira). Si por algún motivo no llega a cargar (bloqueo
   de red, formato no soportado, etc.), cae automáticamente en una
   música ambiental sintetizada en el propio navegador.
   ========================================================= */
const GREEK_TRACK_URL =
  "https://archive.org/download/An_Appreciation-19119/Lina_Palera_Lyre_20_Project_player_-_01_-_Seikilos_Epitaph_with_the_Lyre_of_Apollo.ogg";

// notas en Hz (D3 F3 G3 A3 G3 F3 D3 C3 D3 A2 C3 D3)
const SYNTH_PHRASE_HZ = [146.83, 174.61, 196.0, 220.0, 196.0, 174.61, 146.83, 130.81, 146.83, 110.0, 130.81, 146.83];

function useGameAudio() {
  const [muted, setMuted] = useState(false);
  const [volume, setVolume] = useState(70);
  const [started, setStarted] = useState(false);
  const [source, setSource] = useState(null); // 'external' | 'synth' | null

  const ctxRef = useRef(null);
  const masterGainRef = useRef(null);
  const audioElRef = useRef(null);
  const settledRef = useRef(false);
  const cleanupFnsRef = useRef([]);

  function ensureContext() {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      const ctx = new AC();
      const gain = ctx.createGain();
      gain.gain.value = muted ? 0 : volume / 100;
      gain.connect(ctx.destination);
      ctxRef.current = ctx;
      masterGainRef.current = gain;
    }
    return ctxRef.current;
  }

  useEffect(() => {
    if (masterGainRef.current) {
      masterGainRef.current.gain.value = muted ? 0 : volume / 100;
    }
    if (audioElRef.current) {
      audioElRef.current.volume = volume / 100;
      audioElRef.current.muted = muted;
    }
  }, [volume, muted]);

  useEffect(() => {
    return () => {
      try {
        cleanupFnsRef.current.forEach((fn) => fn());
        if (audioElRef.current) {
          audioElRef.current.pause();
          audioElRef.current.src = "";
        }
        if (ctxRef.current) ctxRef.current.close();
      } catch (e) {}
    };
  }, []);

  function startSynthLoop() {
    if (settledRef.current === "synth") return;
    settledRef.current = "synth";
    setSource("synth");
    try {
      const ctx = ensureContext();
      const master = masterGainRef.current;

      // dron grave sostenido
      const drone = ctx.createOscillator();
      drone.type = "sine";
      drone.frequency.value = 73.42; // D2
      const droneGain = ctx.createGain();
      droneGain.gain.value = 0.06;
      drone.connect(droneGain).connect(master);
      drone.start();

      let i = 0;
      function pluckNote() {
        const t = ctx.currentTime;
        const osc = ctx.createOscillator();
        osc.type = "triangle";
        osc.frequency.value = SYNTH_PHRASE_HZ[i % SYNTH_PHRASE_HZ.length];
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
        osc.connect(g).connect(master);
        osc.start(t);
        osc.stop(t + 1.35);
        i++;
      }
      pluckNote();
      const interval = setInterval(pluckNote, 1500);
      cleanupFnsRef.current.push(() => {
        clearInterval(interval);
        try {
          drone.stop();
        } catch (e) {}
      });
    } catch (e) {}
  }

  async function start() {
    if (started) return;
    setStarted(true);

    const ctx = ensureContext();
    try {
      if (ctx.state === "suspended") await ctx.resume();
    } catch (e) {}

    const el = new Audio(GREEK_TRACK_URL);
    el.loop = true;
    el.preload = "auto";
    el.crossOrigin = "anonymous";
    el.volume = muted ? 0 : volume / 100;
    el.muted = muted;
    audioElRef.current = el;

    const markExternalOk = () => {
      if (settledRef.current) return;
      settledRef.current = "external";
      setSource("external");
    };
    el.addEventListener("playing", markExternalOk, { once: true });
    el.addEventListener("error", startSynthLoop, { once: true });
    // si en 3.5s no arrancó (bloqueo de red, formato no soportado, etc.), respaldo sintetizado
    setTimeout(() => {
      if (!settledRef.current) startSynthLoop();
    }, 3500);

    el.play().catch(startSynthLoop);
  }

  function playBlip() {
    if (muted) return;
    try {
      const ctx = ensureContext();
      if (ctx.state === "suspended") ctx.resume();
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      osc.type = "square";
      osc.frequency.value = 1046.5; // C6
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.3, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      osc.connect(g).connect(masterGainRef.current);
      osc.start(t);
      osc.stop(t + 0.09);
    } catch (e) {}
  }

  return { muted, setMuted, volume, setVolume, start, started, playBlip, source };
}

/* =========================================================
   WIDGET DE CONTROLES DE SONIDO (fijo en pantalla)
   ========================================================= */
function AudioControls({ audio }) {
  const [open, setOpen] = useState(false);
  return (
    <div style={{ position: "fixed", top: 10, right: 10, zIndex: 50, fontFamily: PIXEL_FONT }}>
      <button
        onClick={() => setOpen((o) => !o)}
        style={{
          width: 36,
          height: 36,
          border: `3px solid ${INK}`,
          background: WHITE,
          boxShadow: "3px 3px 0 rgba(0,0,0,.3)",
          fontSize: 15,
          cursor: "pointer",
        }}
        aria-label="Sonido"
      >
        {audio.muted ? "🔇" : "🔊"}
      </button>
      {open && (
        <div
          style={pixelPanel({
            position: "absolute",
            top: 42,
            right: 0,
            padding: "12px 14px",
            width: 170,
            boxShadow: "4px 4px 0 rgba(0,0,0,.3)",
          })}
        >
          <button
            onClick={() => audio.setMuted((m) => !m)}
            style={{
              width: "100%",
              fontFamily: PIXEL_FONT,
              fontSize: 9,
              padding: "8px 6px",
              marginBottom: 10,
              border: `2px solid ${INK}`,
              background: audio.muted ? BLUE : WHITE,
              color: audio.muted ? WHITE : INK,
              cursor: "pointer",
            }}
          >
            {audio.muted ? "SONIDO: OFF" : "SONIDO: ON"}
          </button>
          {audio.source && (
            <div style={{ fontFamily: PIXEL_FONT, fontSize: 7, marginBottom: 10, color: "#556", lineHeight: 1.6 }}>
              {audio.source === "external"
                ? "MÚSICA: GRABACIÓN GRIEGA REAL (CC)"
                : "MÚSICA: AMBIENTE SINTETIZADO"}
            </div>
          )}
          <div style={{ fontFamily: PIXEL_FONT, fontSize: 8, marginBottom: 6, color: "#334" }}>
            VOLUMEN: {audio.volume}
          </div>
          <input
            type="range"
            min="0"
            max="100"
            value={audio.volume}
            onChange={(e) => audio.setVolume(Number(e.target.value))}
            style={{ width: "100%" }}
          />
        </div>
      )}
    </div>
  );
}

/* =========================================================
   ICONOS PIXELADOS TEMÁTICOS
   ========================================================= */
function ThemeIcon({ name, size = 24, color = BLUE }) {
  const px = (x, y, w, h) => <rect key={`${x}-${y}`} x={x} y={y} width={w} height={h} fill={color} />;
  const grids = {
    amphora: [
      [4, 0, 2, 1], [3, 1, 4, 1], [3, 2, 1, 2], [6, 2, 1, 2], [2, 4, 6, 6], [3, 10, 4, 1],
    ],
    hands: [
      [1, 4, 3, 2], [4, 3, 2, 1], [6, 4, 3, 2], [1, 6, 8, 2], [3, 8, 4, 2],
    ],
    shield: [
      [2, 1, 6, 1], [1, 2, 8, 5], [2, 7, 6, 2], [3, 9, 4, 1], [4, 11, 2, 1],
    ],
    owl: [
      [2, 1, 6, 6], [3, 3, 1, 1], [6, 3, 1, 1], [4, 6, 2, 1], [0, 2, 2, 3], [8, 2, 2, 3],
    ],
    scroll: [
      [2, 0, 6, 2], [1, 2, 8, 8], [2, 10, 6, 2], [3, 4, 4, 1], [3, 6, 4, 1],
    ],
  };
  const g = grids[name] || grids.amphora;
  return (
    <svg width={size} height={size} viewBox="0 0 10 12" shapeRendering="crispEdges">
      {g.map(([x, y, w, h]) => px(x, y, w, h))}
    </svg>
  );
}

/* =========================================================

function GlobalGameStyles() {

    <style>{`

      .pix-idle { animation: idleBob 1.8s steps(4) infinite; }
      .pix-thinking { animation: thinkBob 0.7s steps(4) infinite; }

/* =========================================================
   BUSTO DE SÓCRATES — mármol, estilo 8-bit, inspirado en la
   escultura clásica: calvo, cejas pesadas, barba larga y
   ondulada en mechones retorcidos, manto sobre un hombro.
   ========================================================= */
function Socrates({ mood = "pensativo", size = 190 }) {
  const m = MOODS[mood] || MOODS.pensativo;
  // mismo estilo de avatar que se usa para el jugador, pero como hombre anciano:
  // calvo arriba, pelo cano solo a los costados, barba blanca y arrugas.
  const SKIN = "#e8caa0";
  const SKIN_SHADOW = "#c9a876";
  const HAIR = "#e4e1d8"; // cano
  const HAIR_SHADOW = "#c7c3b6";
  const ROBE = "#eef2f5";
  const ROBE_SHADOW = "#c9d2d8";

  // recalibramos los valores de MOODS (pensados para un busto más grande)
  // a la escala más chica de este avatar
  const browY = 84 + (m.browY - 96) * 0.32;
  const mouthShift = m.mouthCurve * 0.5;

  return (
    <div style={{ width: size }}>
      <svg viewBox="0 0 160 200" width={size} height={(size * 200) / 160} shapeRendering="crispEdges">
        {/* hombros / toga (un hombro cubierto, uno al descubierto) */}
        <rect x="20" y="150" width="120" height="50" fill={SKIN} stroke={INK} strokeWidth="3" />
        <rect x="70" y="150" width="60" height="50" fill={ROBE} stroke={INK} strokeWidth="3" />
        <rect x="76" y="156" width="8" height="40" fill={ROBE_SHADOW} opacity="0.6" />
        {/* cuello */}
        <rect x="66" y="132" width="26" height="22" fill={SKIN} stroke={INK} strokeWidth="2.5" />
        {/* cabeza */}
        <rect x="46" y="60" width="66" height="76" fill={SKIN} stroke={INK} strokeWidth="3" />
        {/* arruga de la frente */}
        <rect x="58" y="70" width="44" height="3" fill={SKIN_SHADOW} opacity="0.8" />
        <rect x="60" y="76" width="40" height="3" fill={SKIN_SHADOW} opacity="0.6" />
        {/* pelo cano solo a los costados (calvo arriba, como Sócrates) */}
        <rect x="38" y="72" width="14" height="48" fill={HAIR} stroke={INK} strokeWidth="2" />
        <rect x="108" y="72" width="14" height="48" fill={HAIR} stroke={INK} strokeWidth="2" />
        <rect x="42" y="112" width="76" height="12" fill={HAIR} stroke={INK} strokeWidth="2" />

        {/* cejas canas y expresivas, marcan el ánimo */}
        <rect
          x="54" y={browY} width="18" height="5" fill={HAIR_SHADOW} stroke={INK} strokeWidth="1"
          transform={`rotate(${m.browAngleL} 63 ${browY + 2.5})`}
        />
        <rect
          x="88" y={browY} width="18" height="5" fill={HAIR_SHADOW} stroke={INK} strokeWidth="1"
          transform={`rotate(${m.browAngleR} 97 ${browY + 2.5})`}
        />
        {/* ojos */}
        <rect x="58" y="96" width={8 * m.eyeScale} height={8 * m.eyeScale} fill={INK} />
        <rect x="90" y="96" width={8 * m.eyeScale} height={8 * m.eyeScale} fill={INK} />

        {/* bigote cano, arriba de la boca */}
        <rect x="54" y="108" width="52" height="6" fill={HAIR} stroke={INK} strokeWidth="1.6" />

        {/* boca visible entre el bigote y la barba */}
        {m.open ? (
          <rect x="72" y="116" width="16" height="10" fill={INK} opacity="0.75" />
        ) : (
          <rect x="66" y={116 + mouthShift} width="28" height="4" fill={SKIN_SHADOW} />
        )}

        {/* barba blanca larga que cubre el mentón y baja hasta el pecho */}
        <rect x="46" y="120" width="66" height="34" fill={HAIR} stroke={INK} strokeWidth="2.5" />
        <rect x="40" y="128" width="12" height="20" fill={HAIR} stroke={INK} strokeWidth="2" />
        <rect x="108" y="128" width="12" height="20" fill={HAIR} stroke={INK} strokeWidth="2" />

        {/* mano pensativa junto al mentón, apoyada sobre la barba */}
        <rect x="94" y="112" width="16" height="22" fill={SKIN} stroke={INK} strokeWidth="2.5" />
      </svg>
    </div>
  );
}

/* =========================================================
   PANTALLA: MENÚ — carrusel deslizable, estilo 8-bit
   ========================================================= */
function MenuScreen({ playerName, playerGender, onSelect, playBlip }) {
  const [index, setIndex] = useState(0);
  const [dragX, setDragX] = useState(0);
  const draggingRef = useRef(false);
  const startXRef = useRef(0);

  const clampIndex = (i) => Math.max(0, Math.min(DIALOGUES.length - 1, i));

  function goTo(i) {
    const clamped = clampIndex(i);
    setIndex((prev) => {
      if (clamped !== prev) playBlip && playBlip();
      return clamped;
    });
  }

  function onDown(e) {
    if (e.target.closest && e.target.closest("button")) return;
    draggingRef.current = true;
    startXRef.current = e.clientX ?? e.touches?.[0]?.clientX ?? 0;
  }
  function onMove(e) {
    if (!draggingRef.current) return;
    const x = e.clientX ?? e.touches?.[0]?.clientX ?? 0;
    setDragX(x - startXRef.current);
  }
  function onUp() {
    if (!draggingRef.current) return;
    draggingRef.current = false;
    if (dragX < -60) goTo(index + 1);
    else if (dragX > 60) goTo(index - 1);
    setDragX(0);
  }

  return (
    <div
      style={{
        minHeight: "100vh",
        background: SKY_BLUE,
        color: INK,
        fontFamily: RETRO_FONT,
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
      }}
    >
      <ParthenonBanner />

      <div style={{ maxWidth: 640, width: "100%", padding: "20px 18px 60px", textAlign: "center" }}>
        <div style={{ fontFamily: PIXEL_FONT, fontSize: 10, letterSpacing: 2, color: BLUE }}>
          ΔΙΑΛΟΓΟΙ ΤΟΥ ΠΛΑΤΩΝΟΣ
        </div>
        <h1 style={{ fontFamily: PIXEL_FONT, fontSize: "clamp(16px,4vw,24px)", margin: "10px 0 10px", color: BLUE_DARK, lineHeight: 1.6 }}>
          En diálogo con Sócrates
        </h1>
        <PixelRule />
        <p style={{ fontSize: 22, lineHeight: 1.4, maxWidth: 540, margin: "16px auto 20px", color: "#233" }}>
          {playerGender === "f" ? "Bienvenida" : "Bienvenido"}, {playerName}. Deslizá entre los diálogos de Platón. Sócrates te
          va a guiar paso a paso: en cada momento te ofrece tres posibles
          respuestas, y elegís la que te parezca correcta con un clic.
        </p>

        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 10 }}>
          <button onClick={() => goTo(index - 1)} disabled={index === 0} style={navBtn(index === 0)}>
            ◂
          </button>

          <div
            style={{ width: "100%", maxWidth: 420, overflow: "hidden", touchAction: "pan-y", cursor: "grab" }}
            onPointerDown={onDown}
            onPointerMove={onMove}
            onPointerUp={onUp}
            onPointerLeave={onUp}
          >
            <div
              style={{
                display: "flex",
                transform: `translateX(calc(${-index * 100}% + ${dragX}px))`,
                transition: draggingRef.current ? "none" : "transform .25s steps(8)",
              }}
            >
              {DIALOGUES.map((item) => (
                <div key={item.id} style={{ minWidth: "100%", padding: "4px 6px" }}>
                  <div
                    style={pixelPanel({
                      padding: "22px 20px",
                      minHeight: 270,
                      display: "flex",
                      flexDirection: "column",
                      alignItems: "center",
                      textAlign: "center",
                    })}
                  >
                    <ThemeIcon name={item.icon} size={30} />
                    <div style={{ fontFamily: PIXEL_FONT, fontSize: 10, color: BLUE, letterSpacing: 1, marginTop: 10 }}>
                      {item.greek}
                    </div>
                    <div style={{ fontFamily: PIXEL_FONT, fontSize: 15, margin: "8px 0 4px", color: BLUE_DARK, lineHeight: 1.6 }}>
                      {item.title}
                    </div>
                    <div style={{ fontSize: 18, fontStyle: "italic", color: "#556", marginBottom: 10 }}>{item.subtitle}</div>
                    <div style={{ fontSize: 19, lineHeight: 1.35, color: "#334", marginBottom: 16 }}>{item.setting}</div>
                    <button
                      onClick={() => onSelect(item)}
                      onPointerDown={(e) => e.stopPropagation()}
                      style={{
                        fontFamily: PIXEL_FONT,
                        fontSize: 11,
                        letterSpacing: 1,
                        background: BLUE,
                        color: WHITE,
                        border: `3px solid ${INK}`,
                        boxShadow: "4px 4px 0 rgba(0,0,0,.35)",
                        padding: "10px 18px",
                        cursor: "pointer",
                      }}
                    >
                      ENTRAR ▶
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <button
            onClick={() => goTo(index + 1)}
            disabled={index === DIALOGUES.length - 1}
            style={navBtn(index === DIALOGUES.length - 1)}
          >
            ▸
          </button>
        </div>

        <div style={{ display: "flex", justifyContent: "center", gap: 8, marginTop: 18 }}>
          {DIALOGUES.map((item, i) => (
            <button
              key={item.id}
              onClick={() => goTo(i)}
              style={{
                width: 12,
                height: 12,
                borderRadius: 0,
                border: `2px solid ${INK}`,
                background: i === index ? BLUE : WHITE,
                cursor: "pointer",
                padding: 0,
              }}
            />
          ))}
        </div>
      </div>
    </div>
  );
}

/* =========================================================
   PANTALLA: CAPÍTULO — fondo azul claro, cuadro de texto blanco
   ========================================================= */
function ChapterScreen({ dialogue, playerName, playerGender, onExit }) {
  const firstText = dialogue.steps[0].text.replace(/\{\{name\}\}/g, playerName);
  const [messages, setMessages] = useState([{ role: "socrates", text: firstText }]);
  const [stepIndex, setStepIndex] = useState(0);
  const [currentOptions, setCurrentOptions] = useState(() => shuffle(dialogue.steps[0].options));
  const [mood, setMood] = useState("pensativo");
  const [status, setStatus] = useState("playing"); // playing | won
  const [locked, setLocked] = useState(false);
  const [wrongCount, setWrongCount] = useState(0);
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, status]);

  function pick(opt) {
    if (locked || status !== "playing") return;
    setLocked(true);
    setMessages((m) => [...m, { role: "player", text: opt.text }]);

    setTimeout(() => {
      setMessages((m) => [...m, { role: "socrates", text: opt.reply }]);
      setMood(opt.correct ? "satisfecho" : "esceptico");

      if (opt.correct) {
        const next = stepIndex + 1;
        if (next >= dialogue.steps.length) {
          setTimeout(() => {
            setStatus("won");
            setMood("satisfecho");
          }, 1300);
        } else {
          setTimeout(() => {
            const nextText = dialogue.steps[next].text.replace(/\{\{name\}\}/g, playerName);
            setMessages((m) => [...m, { role: "socrates", text: nextText }]);
            setStepIndex(next);
            setCurrentOptions(shuffle(dialogue.steps[next].options));
            setMood("pensativo");
            setLocked(false);
          }, 1500);
        }
      } else {
        setWrongCount((c) => c + 1);
        setTimeout(() => {
          setCurrentOptions(shuffle(dialogue.steps[stepIndex].options));
          setMood("pensativo");
          setLocked(false);
        }, 1700);
      }
    }, 350);
  }

  const pairs = [];
  for (let i = 0; i < messages.length; i += 2) {
    pairs.push({ socrates: messages[i], player: messages[i + 1] || null });
  }

  return (
    <div
      style={{
        minHeight: "100vh",
        background: SKY_BLUE,
        color: INK,
        fontFamily: RETRO_FONT,
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
      }}
    >
      <ParthenonBanner height={60} />

      <div style={{ maxWidth: 820, width: "100%", padding: "14px 16px 60px" }}>
        <button onClick={onExit} style={backBtn}>
          ◂ VOLVER AL MENÚ
        </button>

        <div style={{ textAlign: "center", marginBottom: 6 }}>
          <div style={{ fontFamily: PIXEL_FONT, fontSize: 9, color: BLUE, letterSpacing: 1 }}>{dialogue.greek}</div>
          <h1 style={{ fontFamily: PIXEL_FONT, fontSize: 18, margin: "6px 0 6px", color: BLUE_DARK }}>{dialogue.title}</h1>
          <div style={{ fontSize: 18, fontStyle: "italic", color: "#334" }}>{dialogue.setting}</div>
        </div>

        <div style={{ display: "flex", justifyContent: "center", margin: "10px 0 6px" }}>
          <div
            style={{
              fontFamily: PIXEL_FONT,
              fontSize: 10,
              background: status === "won" ? BLUE : WHITE,
              color: status === "won" ? WHITE : INK,
              border: `2px solid ${INK}`,
              padding: "6px 14px",
            }}
          >
            PASO {Math.min(stepIndex + (status === "won" ? 1 : 0), dialogue.steps.length)}/{dialogue.steps.length}
          </div>
        </div>

        <PixelRule />

        <div style={{ display: "flex", flexDirection: "column", marginTop: 16 }}>
          <div
            ref={scrollRef}
            style={{
              position: "relative",
              border: `4px solid ${INK}`,
              boxShadow: "6px 6px 0 rgba(0,0,0,.3)",
              height: 420,
              overflowY: "auto",
            }}
          >
            {/* ambientación del diálogo, de fondo, detrás del texto */}
            <div style={{ position: "absolute", inset: 0, zIndex: 0 }}>
              <SceneArt id={dialogue.id} />
              <div style={{ position: "absolute", inset: 0, background: "rgba(255,255,255,.55)" }} />
            </div>

            <div style={{ position: "relative", zIndex: 1, padding: 16 }}>
              {pairs.map((p, i) => (
                <ComicPanel
                  key={i}
                  socratesText={p.socrates.text}
                  playerText={p.player ? p.player.text : null}
                  mood={i === pairs.length - 1 ? mood : "pensativo"}
                  playerName={playerName}
                  playerGender={playerGender}
                />
              ))}
            </div>
          </div>

          {status === "playing" && (
            <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 12 }}>
              {currentOptions.map((opt, i) => (
                <button
                  key={i}
                  onClick={() => pick(opt)}
                  disabled={locked}
                  style={{
                    fontFamily: RETRO_FONT,
                    fontSize: 19,
                    lineHeight: 1.3,
                    textAlign: "left",
                    padding: "12px 16px",
                    border: `3px solid ${INK}`,
                    background: WHITE,
                    color: INK,
                    boxShadow: locked ? "none" : "4px 4px 0 rgba(0,0,0,.25)",
                    cursor: locked ? "default" : "pointer",
                    opacity: locked ? 0.65 : 1,
                  }}
                >
                  {opt.text}
                </button>
              ))}
            </div>
          )}

          {status === "won" && (
            <div style={resultBox(BLUE)}>
              <div style={{ fontFamily: PIXEL_FONT, fontSize: 13, color: BLUE, marginBottom: 8 }}>¡DIÁLOGO COMPLETADO!</div>
              <div style={{ fontSize: 19, marginBottom: 12 }}>
                {playerName}, llegaste a la idea de Sócrates
                {wrongCount > 0 ? ` con ${wrongCount} ${wrongCount === 1 ? "tropiezo" : "tropiezos"} en el camino.` : " sin un solo tropiezo."}
              </div>
              <button onClick={onExit} style={pillBtn(BLUE)}>
                VOLVER AL MENÚ
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

const backBtn = {
  background: "none",
  border: "none",
  color: BLUE,
  fontFamily: PIXEL_FONT,
  fontSize: 9,
  letterSpacing: 1,
  cursor: "pointer",
  marginBottom: 10,
  padding: 0,

  return pixelPanel({ marginTop: 14, padding: 16, textAlign: "center", borderColor: color });
