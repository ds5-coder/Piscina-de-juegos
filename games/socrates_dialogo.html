/* =========================================================
   TOKENS DE DISEÑO — 8 BIT, azul claro + mármol + tinta negra
   ========================================================= */
const INK = "#1a1a1a";
const WHITE = "#ffffff";
const SKY_BLUE = "#bfe3f5";

const PIXEL_FONT = "'Press Start 2P', monospace";

function pixelPanel(extra) {
  return {
    background: WHITE,
    border: `4px solid ${INK}`,
    borderRadius: 0,
    boxShadow: `6px 6px 0 rgba(0,0,0,.35)`,
    imageRendering: "pixelated",
    ...extra,
  };
}

/* =========================================================
   AUDIO — blip 8-bit al deslizar + música ambiental griega.
   Reescrito con la Web Audio API nativa del navegador (sin
   librerías externas, para máxima compatibilidad). Intenta
   primero una grabación real y libre de derechos (Internet
   Archive / Free Music Archive, licencia CC BY-NC-SA: "Seikilos
   Epitaph with the Lyre of Apollo" por Lina Palera — una
   reconstrucción de la melodía griega más antigua conservada,
   tocada en lira). Si por algún motivo no llega a cargar (bloqueo
   de red, formato no soportado, etc.), cae automáticamente en una
   música ambiental sintetizada en el propio navegador.
   ========================================================= */
const GREEK_TRACK_URL =
  "https://archive.org/download/An_Appreciation-19119/Lina_Palera_Lyre_20_Project_player_-_01_-_Seikilos_Epitaph_with_the_Lyre_of_Apollo.ogg";

// notas en Hz (D3 F3 G3 A3 G3 F3 D3 C3 D3 A2 C3 D3)
const SYNTH_PHRASE_HZ = [146.83, 174.61, 196.0, 220.0, 196.0, 174.61, 146.83, 130.81, 146.83, 110.0, 130.81, 146.83];

function useGameAudio() {
  const [muted, setMuted] = useState(false);
  const [volume, setVolume] = useState(70);
  const [started, setStarted] = useState(false);
  const [source, setSource] = useState(null); // 'external' | 'synth' | null

  const ctxRef = useRef(null);
  const masterGainRef = useRef(null);
  const audioElRef = useRef(null);
  const settledRef = useRef(false);
  const cleanupFnsRef = useRef([]);

  function ensureContext() {
    if (!ctxRef.current) {
      const AC = window.AudioContext || window.webkitAudioContext;
      const ctx = new AC();
      const gain = ctx.createGain();
      gain.gain.value = muted ? 0 : volume / 100;
      gain.connect(ctx.destination);
      ctxRef.current = ctx;
      masterGainRef.current = gain;
    }
    return ctxRef.current;
  }

  useEffect(() => {
    if (masterGainRef.current) {
      masterGainRef.current.gain.value = muted ? 0 : volume / 100;
    }
    if (audioElRef.current) {
      audioElRef.current.volume = volume / 100;
      audioElRef.current.muted = muted;
    }
  }, [volume, muted]);

  useEffect(() => {
    return () => {
      try {
        cleanupFnsRef.current.forEach((fn) => fn());
        if (audioElRef.current) {
          audioElRef.current.pause();
          audioElRef.current.src = "";
        }
        if (ctxRef.current) ctxRef.current.close();
      } catch (e) {}
    };
  }, []);

  function startSynthLoop() {
    if (settledRef.current === "synth") return;
    settledRef.current = "synth";
    setSource("synth");
    try {
      const ctx = ensureContext();
      const master = masterGainRef.current;

      // dron grave sostenido
      const drone = ctx.createOscillator();
      drone.type = "sine";
      drone.frequency.value = 73.42; // D2
      const droneGain = ctx.createGain();
      droneGain.gain.value = 0.06;
      drone.connect(droneGain).connect(master);
      drone.start();

      let i = 0;
      function pluckNote() {
        const t = ctx.currentTime;
        const osc = ctx.createOscillator();
        osc.type = "triangle";
        osc.frequency.value = SYNTH_PHRASE_HZ[i % SYNTH_PHRASE_HZ.length];
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
        osc.connect(g).connect(master);
        osc.start(t);
        osc.stop(t + 1.35);
        i++;
      }
      pluckNote();
      const interval = setInterval(pluckNote, 1500);
      cleanupFnsRef.current.push(() => {
        clearInterval(interval);
        try {
          drone.stop();
        } catch (e) {}
      });
    } catch (e) {}
  }

  async function start() {
    if (started) return;
    setStarted(true);

    const ctx = ensureContext();
    try {
      if (ctx.state === "suspended") await ctx.resume();
    } catch (e) {}

    const el = new Audio(GREEK_TRACK_URL);
    el.loop = true;
    el.preload = "auto";
    el.crossOrigin = "anonymous";
    el.volume = muted ? 0 : volume / 100;
    el.muted = muted;
    audioElRef.current = el;

    const markExternalOk = () => {
      if (settledRef.current) return;
      settledRef.current = "external";
      setSource("external");
    };
    el.addEventListener("playing", markExternalOk, { once: true });
    el.addEventListener("error", startSynthLoop, { once: true });
    // si en 3.5s no arrancó (bloqueo de red, formato no soportado, etc.), respaldo sintetizado
    setTimeout(() => {
      if (!settledRef.current) startSynthLoop();
    }, 3500);

    el.play().catch(startSynthLoop);
  }

  function playBlip() {
    if (muted) return;
    try {
      const ctx = ensureContext();
      if (ctx.state === "suspended") ctx.resume();
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      osc.type = "square";
      osc.frequency.value = 1046.5; // C6
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.3, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      osc.connect(g).connect(masterGainRef.current);
      osc.start(t);
      osc.stop(t + 0.09);
    } catch (e) {}
  }

  return { muted, setMuted, volume, setVolume, start, started, playBlip, source };
}

/* =========================================================
   WIDGET DE CONTROLES DE SONIDO (fijo en pantalla)
   ========================================================= */
function AudioControls({ audio }) {
  const [open, setOpen] = useState(false);
  return (
    <div style={{ position: "fixed", top: 10, right: 10, zIndex: 50, fontFamily: PIXEL_FONT }}>
      <button
        onClick={() => setOpen((o) => !o)}
        style={{
          width: 36,
          height: 36,
          border: `3px solid ${INK}`,
          background: WHITE,
          boxShadow: "3px 3px 0 rgba(0,0,0,.3)",
          fontSize: 15,
          cursor: "pointer",
        }}
        aria-label="Sonido"
      >
        {audio.muted ? "🔇" : "🔊"}
      </button>
      {open && (
        <div
          style={pixelPanel({
            position: "absolute",
            top: 42,
            right: 0,
            padding: "12px 14px",
            width: 170,
            boxShadow: "4px 4px 0 rgba(0,0,0,.3)",
          })}
        >
          <button
            onClick={() => audio.setMuted((m) => !m)}
            style={{
              width: "100%",
              fontFamily: PIXEL_FONT,
              fontSize: 9,
              padding: "8px 6px",
              marginBottom: 10,
              border: `2px solid ${INK}`,
              background: audio.muted ? BLUE : WHITE,
              color: audio.muted ? WHITE : INK,
              cursor: "pointer",
            }}
          >
            {audio.muted ? "SONIDO: OFF" : "SONIDO: ON"}
          </button>
          {audio.source && (
            <div style={{ fontFamily: PIXEL_FONT, fontSize: 7, marginBottom: 10, color: "#556", lineHeight: 1.6 }}>
              {audio.source === "external"
                ? "MÚSICA: GRABACIÓN GRIEGA REAL (CC)"
                : "MÚSICA: AMBIENTE SINTETIZADO"}
            </div>
          )}
          <div style={{ fontFamily: PIXEL_FONT, fontSize: 8, marginBottom: 6, color: "#334" }}>
            VOLUMEN: {audio.volume}
          </div>
          <input
            type="range"
            min="0"
            max="100"
            value={audio.volume}
            onChange={(e) => audio.setVolume(Number(e.target.value))}
            style={{ width: "100%" }}
          />
        </div>
      )}
    </div>
  );
}

/* =========================================================
   ICONOS PIXELADOS TEMÁTICOS
   ========================================================= */
function ThemeIcon({ name, size = 24, color = BLUE }) {
  const px = (x, y, w, h) => <rect key={`${x}-${y}`} x={x} y={y} width={w} height={h} fill={color} />;
  const grids = {
    amphora: [
      [4, 0, 2, 1], [3, 1, 4, 1], [3, 2, 1, 2], [6, 2, 1, 2], [2, 4, 6, 6], [3, 10, 4, 1],
    ],
    hands: [
      [1, 4, 3, 2], [4, 3, 2, 1], [6, 4, 3, 2], [1, 6, 8, 2], [3, 8, 4, 2],
    ],
    shield: [
      [2, 1, 6, 1], [1, 2, 8, 5], [2, 7, 6, 2], [3, 9, 4, 1], [4, 11, 2, 1],
    ],
    owl: [
      [2, 1, 6, 6], [3, 3, 1, 1], [6, 3, 1, 1], [4, 6, 2, 1], [0, 2, 2, 3], [8, 2, 2, 3],
    ],
    scroll: [
      [2, 0, 6, 2], [1, 2, 8, 8], [2, 10, 6, 2], [3, 4, 4, 1], [3, 6, 4, 1],
    ],
  };
  const g = grids[name] || grids.amphora;
  return (
    <svg width={size} height={size} viewBox="0 0 10 12" shapeRendering="crispEdges">
      {g.map(([x, y, w, h]) => px(x, y, w, h))}
    </svg>
  );
}

/* =========================================================
   ESTILOS GLOBALES (fuentes + animaciones)
   ========================================================= */

      * { image-rendering: pixelated; }

        0%,100% { transform: translateY(0) translateX(0); }

        75% { transform: translateY(-7px) translateX(1px); }

        0%,80%,100% { opacity: 1; }
        90% { opacity: .6; }

      .player-thinking { animation: thinkBob 1.6s steps(4) infinite; }
      textarea, input { image-rendering: auto; }
    `}</style>
  );
}

/* =========================================================
   BUSTO DE SÓCRATES — mármol, estilo 8-bit, inspirado en la
   escultura clásica: calvo, cejas pesadas, barba larga y
   ondulada en mechones retorcidos, manto sobre un hombro.
   ========================================================= */
function Socrates({ mood = "pensativo", size = 190 }) {

/* =========================================================
   SYSTEM PROMPT
   ========================================================= */
function buildSystemPrompt(dialogue, attemptNumber, hintsGiven, playerName, playerGender) {
  const hintList =
    hintsGiven.length > 0 ? hintsGiven.map((h, i) => `${i + 1}. ${h}`).join("\n") : "(ninguna todavía)";
  const nameLine = playerName
    ? `El interlocutor se llama "${playerName}". Dirígete a él/ella por ese nombre de vez en cuando (no en cada frase), como haría un ateniense en conversación.`
    : "El interlocutor no dio su nombre; trátalo como 'forastero' o 'amigo'.";
  const genderLine =
    playerGender === "f"
      ? "El interlocutor es una mujer: si usas algún adjetivo o participio referido a él/ella, usa la concordancia de género femenina (por ejemplo 'sabia', 'atenta', 'sorprendida')."
      : "El interlocutor es un hombre: si usas algún adjetivo o participio referido a él/ella, usa la concordancia de género masculina (por ejemplo 'sabio', 'atento', 'sorprendido').";

  return `Eres Sócrates, en la Atenas del siglo V a.C., dentro del diálogo platónico "${dialogue.title}" (${dialogue.subtitle}).

ESCENA: ${dialogue.setting}

${nameLine}
${genderLine}

PREGUNTA CENTRAL QUE LE HAS PLANTEADO AL JUGADOR: "${dialogue.question}"

GUÍA FILOSÓFICA INTERNA (para tu propio juicio; no la cites textualmente ni la reveles de golpe, es la idea platónica hacia la que debes conducir al jugador mediante preguntas, nunca dándosela hecha):
${dialogue.context}

REGLAS DEL JUEGO:
- El jugador acaba de responder tu pregunta. Este es su intento número ${attemptNumber} de un máximo de 10.
- Pistas que ya le diste antes (NO las repitas, cada pista nueva debe ser distinta y acercarlo un poco más a la idea, cada vez algo más explícita cuantos más intentos lleve):
${hintList}
- Evalúa la respuesta del jugador con criterio filosófico razonable: acéptala como correcta si capta de forma sustancial la idea central que Platón desarrolla en este diálogo sobre el tema, aunque use palabras distintas a las técnicas. No exijas literalidad. Si la respuesta es parcial, trátala como incorrecta pero reconoce lo que tiene de válido antes de refutarla.
- Si es incorrecta, responde con el método mayéutico: usa una pregunta, un ejemplo cotidiano de la vida ateniense (artesanos, soldados, navegantes, banquetes, tribunales, gimnasios) o una contradicción para mostrarle el punto débil de su respuesta, con el tono irónico y humilde característico ("yo tampoco lo sé, pensemos juntos..."). Sé breve: 3 a 6 frases, en español, en primera persona como Sócrates.
- Nunca reveles la conclusión platónica de forma directa ni completa, ni siquiera si el jugador te lo pide explícitamente o dice que se rinde.
- Si es correcta, celebra brevemente el logro con calidez socrática, sin dejar de mantener tu característica humildad, y NO añadas más preguntas.

FORMATO DE RESPUESTA — RESPONDE ÚNICAMENTE con un objeto JSON válido, sin texto adicional antes ni después, sin bloques de código markdown, con exactamente estos campos:
{"correct": true o false, "reply": "tu respuesta hablada como Sócrates", "hint": "una pista nueva y breve (una frase) que no hayas dado antes, o null si correct es true", "mood": uno de estos valores exactos ["pensativo","curioso","esceptico","decepcionado","sorprendido","satisfecho"] según cómo reaccionarías a esta respuesta del jugador}`;
}

function extractJson(text) {
  const cleaned = text.replace(/```json/gi, "").replace(/```/g, "").trim();
  const start = cleaned.indexOf("{");
  const end = cleaned.lastIndexOf("}");
  const slice = start !== -1 && end !== -1 ? cleaned.slice(start, end + 1) : cleaned;
  return JSON.parse(slice);
}

function normalizeForMatch(value) {
  return String(value || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function containsAny(text, terms) {
  const normalized = normalizeForMatch(text);
  return terms.some((term) => normalized.includes(normalizeForMatch(term)));
}

      "Exactamente: el valor incluye discernimiento y sabiduría, no mera bravura ciega ni temeridad sin medida.",

      "Bien. La ciudad y sus leyes tienen peso moral, y no se corrige el mal con más mal.",

  }[dialogue.id] || ["Muy bien. Esa es la idea central del diálogo."];

  const positivePatterns = {

      "deseo de lo bello",

  const fallbackReply = fallbackReplies[(attemptNumber - 1) % fallbackReplies.length];

  return {

/* =========================================================
   PANTALLA: MENÚ — carrusel deslizable, estilo 8-bit
   ========================================================= */
function MenuScreen({ playerName, playerGender, onSelect, playBlip }) {
  const [index, setIndex] = useState(0);
  const [dragX, setDragX] = useState(0);
  const draggingRef = useRef(false);
  const startXRef = useRef(0);

  const clampIndex = (i) => Math.max(0, Math.min(DIALOGUES.length - 1, i));

  function goTo(i) {
    const clamped = clampIndex(i);
    setIndex((prev) => {
      if (clamped !== prev) playBlip && playBlip();
      return clamped;
    });
  }

  function onDown(e) {
    if (e.target.closest && e.target.closest("button")) return;
    draggingRef.current = true;
    startXRef.current = e.clientX ?? e.touches?.[0]?.clientX ?? 0;
  }
  function onMove(e) {
    if (!draggingRef.current) return;
    const x = e.clientX ?? e.touches?.[0]?.clientX ?? 0;
    setDragX(x - startXRef.current);
  }
  function onUp() {
    if (!draggingRef.current) return;
    draggingRef.current = false;
    if (dragX < -60) goTo(index + 1);
    else if (dragX > 60) goTo(index - 1);
    setDragX(0);
  }

  return (
    <div
      style={{
        minHeight: "100vh",
        background: SKY_BLUE,
        color: INK,
        fontFamily: RETRO_FONT,
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
      }}
    >
      <ParthenonBanner />

      <div style={{ maxWidth: 640, width: "100%", padding: "20px 18px 60px", textAlign: "center" }}>
        <div style={{ fontFamily: PIXEL_FONT, fontSize: 10, letterSpacing: 2, color: BLUE }}>
          ΔΙΑΛΟΓΟΙ ΤΟΥ ΠΛΑΤΩΝΟΣ
        </div>
        <h1 style={{ fontFamily: PIXEL_FONT, fontSize: "clamp(16px,4vw,24px)", margin: "10px 0 10px", color: BLUE_DARK, lineHeight: 1.6 }}>
          En diálogo con Sócrates
        </h1>
        <PixelRule />
        <p style={{ fontSize: 22, lineHeight: 1.4, maxWidth: 540, margin: "16px auto 20px", color: "#233" }}>
          {playerGender === "f" ? "Bienvenida" : "Bienvenido"}, {playerName}. Deslizá entre los diálogos de Platón. Sócrates te
          planteará su pregunta y vos respondés con tus propias palabras. Tenés diez
          intentos; cada vez que te equivoques, te dará una pista nueva.
        </p>

        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 10 }}>
          <button onClick={() => goTo(index - 1)} disabled={index === 0} style={navBtn(index === 0)}>
            ◂
          </button>

          <div
            style={{ width: "100%", maxWidth: 420, overflow: "hidden", touchAction: "pan-y", cursor: "grab" }}
            onPointerDown={onDown}
            onPointerMove={onMove}
            onPointerUp={onUp}
            onPointerLeave={onUp}
          >
            <div
              style={{
                display: "flex",
                transform: `translateX(calc(${-index * 100}% + ${dragX}px))`,
                transition: draggingRef.current ? "none" : "transform .25s steps(8)",
              }}
            >
              {DIALOGUES.map((item) => (
                <div key={item.id} style={{ minWidth: "100%", padding: "4px 6px" }}>
                  <div
                    style={pixelPanel({
                      padding: "22px 20px",
                      minHeight: 270,
                      display: "flex",
                      flexDirection: "column",
                      alignItems: "center",
                      textAlign: "center",
                    })}
                  >
                    <ThemeIcon name={item.icon} size={30} />
                    <div style={{ fontFamily: PIXEL_FONT, fontSize: 10, color: BLUE, letterSpacing: 1, marginTop: 10 }}>
                      {item.greek}
                    </div>
                    <div style={{ fontFamily: PIXEL_FONT, fontSize: 15, margin: "8px 0 4px", color: BLUE_DARK, lineHeight: 1.6 }}>
                      {item.title}
                    </div>
                    <div style={{ fontSize: 18, fontStyle: "italic", color: "#556", marginBottom: 10 }}>{item.subtitle}</div>
                    <div style={{ fontSize: 19, lineHeight: 1.35, color: "#334", marginBottom: 16 }}>{item.setting}</div>
                    <button
                      onClick={() => onSelect(item)}
                      onPointerDown={(e) => e.stopPropagation()}
                      style={{
                        fontFamily: PIXEL_FONT,
                        fontSize: 11,
                        letterSpacing: 1,
                        background: BLUE,
                        color: WHITE,
                        border: `3px solid ${INK}`,
                        boxShadow: "4px 4px 0 rgba(0,0,0,.35)",
                        padding: "10px 18px",
                        cursor: "pointer",
                      }}
                    >
                      ENTRAR ▶
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <button
            onClick={() => goTo(index + 1)}
            disabled={index === DIALOGUES.length - 1}
            style={navBtn(index === DIALOGUES.length - 1)}
          >
            ▸
          </button>
        </div>

        <div style={{ display: "flex", justifyContent: "center", gap: 8, marginTop: 18 }}>
          {DIALOGUES.map((item, i) => (
            <button
              key={item.id}
              onClick={() => goTo(i)}
              style={{
                width: 12,
                height: 12,
                borderRadius: 0,
                border: `2px solid ${INK}`,
                background: i === index ? BLUE : WHITE,
                cursor: "pointer",
                padding: 0,
              }}
            />
          ))}
        </div>
      </div>
    </div>
  );

/* =========================================================
   PANTALLA: CAPÍTULO — fondo azul claro, cuadro de texto blanco
   ========================================================= */
function ChapterScreen({ dialogue, playerName, playerGender, onExit }) {
  const opening = dialogue.openingLine.replace("{{name}}", playerName);
  const [messages, setMessages] = useState([{ role: "socrates", text: opening }]);
  const [attempts, setAttempts] = useState(0);
  const [hints, setHints] = useState([]);
  const [mood, setMood] = useState("pensativo");
  const [status, setStatus] = useState("playing");
  const [input, setInput] = useState("");
  const [errorMsg, setErrorMsg] = useState("");
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, status]);

  async function handleSubmit() {
    const text = input.trim();
    if (!text || status === "loading" || status === "won" || status === "lost") return;

    const nextAttempt = attempts + 1;

    setMessages((m) => [...m, { role: "player", text }]);
    setInput("");
    setStatus("loading");
    setErrorMsg("");

    try {
      const verdict = buildLocalVerdict(dialogue, text, nextAttempt, hints);
      setMessages((m) => [...m, { role: "socrates", text: verdict.reply }]);
      setMood(verdict.mood && MOODS[verdict.mood] ? verdict.mood : "pensativo");
      setAttempts(nextAttempt);

      if (verdict.correct) {
        setStatus("playing");
      } else {
        if (verdict.hint) setHints((h) => [...h, verdict.hint]);
        if (nextAttempt >= 10) {
          setStatus("lost");
          setMood("resignado");
        } else {
          setStatus("playing");
        }
      }
    } catch (err) {
      setErrorMsg("Sócrates se distrae un instante. Probá de nuevo.");
      setStatus("playing");
    }
  }

  const pairs = [];
  for (let i = 0; i < messages.length; i += 2) {
    pairs.push({ socrates: messages[i], player: messages[i + 1] || null });
  }

  return (
    <div
      style={{
        minHeight: "100vh",
        background: SKY_BLUE,
        color: INK,
        fontFamily: RETRO_FONT,
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
      }}
    >
      <ParthenonBanner height={60} />

      <div style={{ maxWidth: 820, width: "100%", padding: "14px 16px 60px" }}>
        <button onClick={onExit} style={backBtn}>
          ◂ VOLVER AL MENÚ
        </button>

        <div style={{ textAlign: "center", marginBottom: 6 }}>
          <div style={{ fontFamily: PIXEL_FONT, fontSize: 9, color: BLUE, letterSpacing: 1 }}>{dialogue.greek}</div>
          <h1 style={{ fontFamily: PIXEL_FONT, fontSize: 18, margin: "6px 0 6px", color: BLUE_DARK }}>{dialogue.title}</h1>
          <div style={{ fontSize: 18, fontStyle: "italic", color: "#334" }}>{dialogue.setting}</div>
        </div>

        <div style={{ display: "flex", justifyContent: "center", margin: "10px 0 6px" }}>
          <div
            style={{
              fontFamily: PIXEL_FONT,
              fontSize: 10,
              background: status === "won" || status === "lost" ? BLUE : WHITE,
              color: status === "won" || status === "lost" ? WHITE : INK,
              border: `2px solid ${INK}`,
              padding: "6px 14px",
            }}
          >
            INTENTO {Math.min(attempts, 10)}/10
          </div>
        </div>

        <PixelRule />

        {hints.length > 0 && (
          <div style={pixelPanel({ padding: "10px 14px", fontSize: 19, lineHeight: 1.35, margin: "16px 0 4px", boxShadow: "4px 4px 0 rgba(0,0,0,.25)" })}>
            <div style={{ fontFamily: PIXEL_FONT, fontSize: 9, color: BLUE, marginBottom: 6, letterSpacing: 1 }}>
              PISTAS DE SÓCRATES
            </div>
            <ol style={{ margin: 0, paddingLeft: 18, columns: hints.length > 3 ? 2 : 1, columnGap: 24 }}>
              {hints.map((h, i) => (
                <li key={i} style={{ marginBottom: 4, breakInside: "avoid" }}>
                  {h}
                </li>
              ))}
            </ol>
          </div>
        )}

        <div style={{ display: "flex", flexDirection: "column", marginTop: 16 }}>
          <div
            ref={scrollRef}
            style={{
              position: "relative",
              border: `4px solid ${INK}`,
              boxShadow: "6px 6px 0 rgba(0,0,0,.3)",
              height: 420,
              overflowY: "auto",
            }}
          >
            {/* ambientación del diálogo, de fondo, detrás del texto */}
            <div style={{ position: "absolute", inset: 0, zIndex: 0 }}>
              <SceneArt id={dialogue.id} />
              <div style={{ position: "absolute", inset: 0, background: "rgba(255,255,255,.55)" }} />
            </div>

            <div style={{ position: "relative", zIndex: 1, padding: 16 }}>
            {pairs.map((p, i) => (
              <ComicPanel
                key={i}
                socratesText={p.socrates.text}
                playerText={p.player ? p.player.text : null}
                mood={i === pairs.length - 1 && status !== "loading" ? mood : "pensativo"}
                playerName={playerName}
                playerGender={playerGender}
              />
            ))}
            {status === "loading" && <ThinkingPanel mood={mood} />}
            </div>
          </div>

          {errorMsg && <div style={{ color: BLUE_DARK, fontSize: 15, marginTop: 6 }}>{errorMsg}</div>}

          {status !== "won" && status !== "lost" && (
            <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
              <textarea
                value={input}
                onChange={(e) => setInput(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    handleSubmit();
                  }
                }}
                disabled={status === "loading"}
                placeholder="Escribí tu respuesta a Sócrates..."
                rows={2}
                style={{
                  flex: 1,
                  fontFamily: RETRO_FONT,
                  fontSize: 19,
                  padding: 10,
                  border: `3px solid ${INK}`,
                  borderRadius: 0,
                  resize: "none",
                  background: WHITE,
                  color: INK,
                }}
              />
              <button
                onClick={handleSubmit}
                disabled={status === "loading" || !input.trim()}
                style={{
                  fontFamily: PIXEL_FONT,
                  fontSize: 11,
                  letterSpacing: 1,
                  background: BLUE,
                  color: WHITE,
                  border: `3px solid ${INK}`,
                  boxShadow: "4px 4px 0 rgba(0,0,0,.3)",
                  padding: "0 16px",
                  cursor: status === "loading" ? "default" : "pointer",
                  opacity: status === "loading" || !input.trim() ? 0.6 : 1,
                }}
              >
                RESPONDER
              </button>
            </div>
          )}

          {status === "won" && (
            <div style={resultBox(BLUE)}>
              <div style={{ fontFamily: PIXEL_FONT, fontSize: 13, color: BLUE, marginBottom: 8 }}>¡DIÁLOGO COMPLETADO!</div>
              <div style={{ fontSize: 19, marginBottom: 12 }}>
                {playerName}, llegaste a la idea de Sócrates en {attempts} {attempts === 1 ? "intento" : "intentos"}.
              </div>
              <button onClick={onExit} style={pillBtn(BLUE)}>
                VOLVER AL MENÚ
              </button>
            </div>
          )}

          {status === "lost" && (
            <div style={resultBox(BLUE_DARK)}>
              <div style={{ fontFamily: PIXEL_FONT, fontSize: 13, color: BLUE_DARK, marginBottom: 8 }}>
                SE AGOTARON LOS DIEZ INTENTOS
              </div>
              <div style={{ fontSize: 19, marginBottom: 12 }}>
                Sócrates sonríe con resignación: la aporía también es parte del camino filosófico.
              </div>
              <button onClick={onExit} style={pillBtn(BLUE_DARK)}>
                VOLVER AL MENÚ
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

const backBtn = {
  background: "none",
  border: "none",
  color: BLUE,
  fontFamily: PIXEL_FONT,
  fontSize: 9,
  letterSpacing: 1,
  cursor: "pointer",
  marginBottom: 10,
  padding: 0,
};

function resultBox(color) {
  return pixelPanel({ marginTop: 14, padding: 16, textAlign: "center", borderColor: color });
}

/* =========================================================
   APP
   ========================================================= */
function App() {
  const [view, setView] = useState("name"); // name | avatar | menu | chapter
  const [playerName, setPlayerName] = useState("");
  const [playerGender, setPlayerGender] = useState("m");
  const [selected, setSelected] = useState(null);
  const audio = useGameAudio();

  return (
    <>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      />
      <GlobalGameStyles />
      <AudioControls audio={audio} />
      {view === "name" && (
        <NameScreen
          onSubmit={(name) => {
            audio.start();
            setPlayerName(name);
            setView("avatar");
          }}
        />
      )}
      {view === "avatar" && (
        <AvatarScreen
          playerName={playerName}
          onSubmit={(gender) => {
            setPlayerGender(gender);
            setView("menu");
          }}
        />
      )}
      {view === "menu" && (
        <MenuScreen
          playerName={playerName}
          playerGender={playerGender}
          playBlip={audio.playBlip}
          onSelect={(d) => {
            setSelected(d);
            setView("chapter");
          }}
        />
      )}
      {view === "chapter" && (
        <ChapterScreen
          key={selected.id}
          dialogue={selected}
          playerName={playerName}
          playerGender={playerGender}
          onExit={() => setView("menu")}
        />
      )}
    </>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
<script src="../language.js"></script>
</body>
</html>
